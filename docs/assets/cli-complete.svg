<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="650" viewBox="0 0 1200 650" role="img" aria-labelledby="title desc">
  <title id="title">Axiom Forge CLI — projeto pronto</title>
  <desc id="desc">Captura estilizada do terminal Ink exibindo a conclusão da geração de um projeto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1"><stop offset="0" stop-color="#111827"/><stop offset="1" stop-color="#090d16"/></linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000" flood-opacity=".35"/></filter>
  </defs>
  <rect width="1200" height="650" fill="#060912"/>
  <rect x="38" y="30" width="1124" height="590" rx="18" fill="url(#bg)" stroke="#26334b" stroke-width="2" filter="url(#shadow)"/>
  <rect x="38" y="30" width="1124" height="52" rx="18" fill="#161e30"/><rect x="38" y="64" width="1124" height="18" fill="#161e30"/>
  <circle cx="72" cy="56" r="8" fill="#ff5f57"/><circle cx="98" cy="56" r="8" fill="#febc2e"/><circle cx="124" cy="56" r="8" fill="#28c840"/>
  <text x="600" y="61" text-anchor="middle" fill="#8491aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">create-axiom-forge · Ink terminal</text>
  <rect x="82" y="137" width="1036" height="330" rx="16" fill="#0d1421" stroke="#2b3b55"/>
  <text x="112" y="181" fill="#f5b942" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="25" font-weight="700">╭─ FORGE COMPLETE</text>
  <text x="112" y="227" fill="#84e1a9" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="23" font-weight="700">│  ✓ /workspace/meu-projeto</text>
  <text x="112" y="267" fill="#c7d0e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">│  full · nextjs · nestjs</text>
  <text x="112" y="307" fill="#c7d0e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">│  agents: claude + codex</text>
  <text x="112" y="347" fill="#c7d0e0" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">│  db: postgres · broker: rabbitmq</text>
  <text x="112" y="387" fill="#f5b942" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="21">╰────────────────────────────────────────────</text>
  <text x="82" y="522" fill="#8491aa" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="18">Próximos passos</text>
  <text x="82" y="558" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ cd meu-projeto</text>
  <text x="330" y="558" fill="#7dd3fc" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="20">$ /kickoff</text>
  <text x="82" y="592" fill="#9ba8c1" font-family="ui-monospace, SFMono-Regular, Menlo, monospace" font-size="17">A forja termina aqui. A descoberta do produto começa agora.</text>
</svg>
